<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mbridge</title>
<link rel="stylesheet" href="style.css">
<script src="_magpie/bridge.js"></script>
<script src="view.js"></script>
</head>
<body>
<main class="root">
  <header class="head">
    <h1 data-t="title">mbridge</h1>
    <p class="subtitle" data-t="subtitle"></p>
    <p class="since" id="since"></p>
  </header>

  <div class="bar">
    <div class="segmented" id="periods">
      <button type="button" data-period="today" aria-selected="false"></button>
      <button type="button" data-period="7d" aria-selected="false"></button>
      <button type="button" data-period="30d" aria-selected="false"></button>
    </div>
    <div class="segmented" id="sorts">
      <button type="button" data-sort="tokens" aria-selected="false"></button>
      <button type="button" data-sort="calls" aria-selected="false"></button>
      <button type="button" data-sort="cost" aria-selected="false"></button>
    </div>
  </div>

  <section class="tiles" id="tiles"></section>

  <section class="models">
    <h2 data-t="models">by model</h2>
    <table class="table">
      <thead>
        <tr>
          <th data-t="model">model</th>
          <th class="num" data-t="calls">calls</th>
          <th class="num" data-t="tokens">tokens</th>
          <th class="num" data-t="cost">cost</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <p class="muted empty" id="empty" hidden></p>
  </section>

  <section class="mbridge">
    <div class="mbridge-head">
      <h2 data-t="mbridge">mbridge</h2>
      <span id="mbridge-age" class="muted"></span>
    </div>
    <div id="mbridge-stats" class="stats"></div>
    <h3 data-t="mbridgeLive">sessions running now</h3>
    <div id="mbridge-live" class="cards"></div>
    <h3 data-t="mbridgeDecisions">recent decisions</h3>
    <table class="table mbridge-table">
      <thead>
        <tr>
          <th></th><th data-t="harness">harness</th><th data-t="agent">agent</th>
          <th data-t="tier">tier</th><th data-t="advised">advised</th>
          <th data-t="reason">reason</th><th class="num" data-t="conf">confidence</th>
        </tr>
      </thead>
      <tbody id="mbridge-decisions"></tbody>
    </table>
    <p id="mbridge-empty" class="muted"></p>
    <div class="mbridge-actions">
      <button type="button" id="mbridge-ask" class="btn"></button>
      <button type="button" id="mbridge-restart" class="btn"></button>
    </div>
  </section>

  <section class="notes">
    <p class="note" data-t="disclaimer"></p>
    <p class="note">
      <span id="status"></span>
      <span class="addr" id="addr" title="select and copy it"></span>
      <span id="restart"></span>
      <code class="cmd" id="cmd"></code>
    </p>
  </section>

  <p class="error" id="error" hidden></p>
</main>
<script src="app.js" defer></script>
</body>
</html>
